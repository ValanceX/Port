name: CI

on:
  # Branch pushes only: a release tag runs all of CI through release.yml.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs all of CI on the tagged commit first.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The Web PORT against each MESH minor its peer range claims (a range says what is allowed; this says what was run).
  mesh-range:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-mesh-range.mjs

  # The Desktop PORT (packages/port-desktop): a Rust crate. Its logic and the contract tests run without a display; the window feature is built too. Linux and Windows.
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: packages/port-desktop
    steps:
      - uses: actions/checkout@v4
      # MESH's conformance vectors come from their package (decision Q2): tests/conformance.rs reads them from node_modules.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the conformance vectors
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: No copy of the vectors, and the package is new enough
        working-directory: .
        run: node scripts/check-conformance.mjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/port-desktop/target
          key: port-desktop-${{ matrix.os }}-${{ hashFiles('packages/port-desktop/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Without the window (no graphics dependency)
        run: cargo test --locked --no-default-features
