name: Release

# Builds a PORT release from its tag and publishes it, as MESH's release.yml
# does: all of CI on the tagged commit, then @valancex/port-web and
# @valancex/port-desktop-vocabulary (one version, published together) packed,
# published to npm with provenance, and a GitHub release with the tarballs
# and the version's release notes (docs/releases/vX.Y.md).
#
# - A pushed `v*` tag publishes. Its tag must be `v` + the version both
#   packages share. Tagging the release commit is the maintainer's step.
# - A manual run publishes only with `publish` set, and only from a tag;
#   otherwise it's a dry run: everything but the publishing.
# - A pull request that changes this workflow runs the dry run.
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC): no token is stored. Each package
# (@valancex/port-web, @valancex/port-desktop-vocabulary) has a trusted publisher on npmjs.com
# (package > Settings > Trusted Publisher > GitHub Actions) naming this repository
# (ValanceX/Port) and this workflow file (`release.yml`, exactly). The publish job gets a
# short-lived credential from GitHub (`id-token: write`) and npm >= 11.5.1 exchanges it;
# provenance is attached automatically. A package that does not exist yet cannot have a
# trusted publisher, so its first version is published by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and make the GitHub release (only from a tag)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI, on the commit being released.
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p out
          pnpm --filter @valancex/port-web pack --pack-destination "$PWD/out"
          pnpm --filter @valancex/port-desktop-vocabulary pack --pack-destination "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: out/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing (and provenance)
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or later)
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out
      - name: Check what is being released
        run: |
          ls -l out
          version="$(node -p 'require("./packages/port-web/package.json").version')"
          tag="v${version}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          if [ "$(node -p 'require("./packages/port-desktop-vocabulary/package.json").version')" != "${version}" ]; then
            echo "::error::@valancex/port-web and @valancex/port-desktop-vocabulary must share one version"
            exit 1
          fi
          if [ "$(ls out/*.tgz | wc -l)" != "2" ] || [ ! -f "out/valancex-port-web-${version}.tgz" ] || [ ! -f "out/valancex-port-desktop-vocabulary-${version}.tgz" ]; then
            echo "::error::Expected exactly the tarballs valancex-port-web-${version}.tgz and valancex-port-desktop-vocabulary-${version}.tgz"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but the packages are ${version}: tag ${tag}"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing needs a tag: push ${tag}"
            exit 1
          fi
          notes="docs/releases/v$(echo "$version" | cut -d. -f1,2).md"
          if [ ! -f "$notes" ]; then
            echo "::error::No release notes at ${notes}"
            exit 1
          fi
          echo "NOTES=${notes}" >> "$GITHUB_ENV"
          for name in @valancex/port-web @valancex/port-desktop-vocabulary; do
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              if [ "$PUBLISH" = "true" ]; then
                echo "::error::${name}@${version} is already on npm"
                exit 1
              fi
              echo "::warning::${name}@${version} is already on npm; a release needs a version bump"
            fi
          done
      - name: Publish to npm (trusted publishing, no token)
        run: |
          # Absolute, so npm reads each tarball as a file, not a GitHub spec.
          for tarball in "$PWD"/out/valancex-port-web-"${TAG#v}".tgz "$PWD"/out/valancex-port-desktop-vocabulary-"${TAG#v}".tgz; do
            if [ "$PUBLISH" = "true" ]; then
              npm publish "$tarball" --access public --provenance
            else
              npm publish "$tarball" --access public --provenance=false --dry-run
            fi
          done
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "PORT $TAG" --notes-file "$NOTES" --verify-tag out/*.tgz
