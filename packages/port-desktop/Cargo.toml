[package]
name = "valancex-port-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Desktop PORT: realizes MESH render trees as native windows (Linux, Windows, macOS) and reports interactions as handler identifiers and payloads."
license = "MIT"
authors = ["Jack Miller <jackmiller0899@gmail.com>"]
repository = "https://github.com/ValanceX/Port"
readme = "README.md"
keywords = ["valance", "ui", "desktop", "render"]
categories = ["gui"]

[lib]
name = "port_desktop"
path = "src/lib.rs"

# The window `vlx dev` opens for any application's engine (VLX_ENGINE).
[[bin]]
name = "vlx-window"
path = "src/bin/vlx-window.rs"
required-features = ["window"]

[features]
default = ["window"]
# The egui window. Without it the crate is the PORT's logic and the host protocol only: no graphics dependency, usable in tests and tools.
window = ["dep:eframe", "dep:egui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"], optional = true }
egui = { version = "0.31", optional = true }
